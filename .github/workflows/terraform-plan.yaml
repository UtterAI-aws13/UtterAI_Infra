name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "plan 대상 환경입니다."
        required: true
        type: choice
        options:
          - dev
          - prod
      layer:
        description: "plan 대상 Terraform layer입니다."
        required: true
        type: choice
        options:
          - 01-network
          - 02-eks
          - 03-services
          - 04-addons

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate workflow variables
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "AWS_TERRAFORM_PLAN_ROLE_ARN GitHub Variable이 필요합니다."
            echo "이 role은 Terraform remote state 조회와 plan에 필요한 read 권한이 있어야 합니다."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Decide target directories
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "dirs<<EOF"
              echo "terraform/environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.layer }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_DIRS="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- "terraform/environments/*/*/**" \
            | awk -F/ '/^terraform\/environments\/[^/]+\/[^/]+\// { print $1 "/" $2 "/" $3 "/" $4 }' \
            | sort -u)"

          if [ -z "$CHANGED_DIRS" ]; then
            CHANGED_DIRS="$(printf "%s\n" \
              "terraform/environments/dev/01-network" \
              "terraform/environments/dev/02-eks" \
              "terraform/environments/dev/03-services" \
              "terraform/environments/dev/04-addons")"
          fi

          {
            echo "dirs<<EOF"
            echo "$CHANGED_DIRS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        env:
          TARGET_DIRS: ${{ steps.targets.outputs.dirs }}
          PROD_CLOUDFRONT_ALIASES: ${{ vars.TF_VAR_CLOUDFRONT_ALIASES }}
          PROD_ROUTE53_HOSTED_ZONE_ID: ${{ vars.TF_VAR_ROUTE53_HOSTED_ZONE_ID }}
        run: |
          {
            echo "## Terraform Plan"
            echo ""
            echo "대상 디렉토리:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue

            echo "- \`$dir\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TARGET_DIRS"

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue

            plan_file="/tmp/$(basename "$dir").plan.txt"

            unset TF_VAR_cloudfront_aliases
            unset TF_VAR_route53_hosted_zone_id

            if [ "$dir" = "terraform/environments/prod/04-addons" ]; then
              if [ -z "$PROD_CLOUDFRONT_ALIASES" ] || [ -z "$PROD_ROUTE53_HOSTED_ZONE_ID" ]; then
                echo "prod 04-addons plan에는 TF_VAR_CLOUDFRONT_ALIASES, TF_VAR_ROUTE53_HOSTED_ZONE_ID GitHub Variables가 필요합니다."
                exit 1
              fi

              export TF_VAR_cloudfront_aliases="$PROD_CLOUDFRONT_ALIASES"
              export TF_VAR_route53_hosted_zone_id="$PROD_ROUTE53_HOSTED_ZONE_ID"
            fi

            echo "Terraform init: $dir"
            terraform -chdir="$dir" init -reconfigure

            echo "Terraform plan: $dir"
            terraform -chdir="$dir" plan -no-color -input=false | tee "$plan_file"

            {
              echo ""
              echo "### $dir"
              echo ""
              echo '```text'
              cat "$plan_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done <<< "$TARGET_DIRS"
