name: Backend Kustomize CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "k8s/apps/backend/**"
      - "deploy/argocd/**"
      - ".github/workflows/backend-kustomize-ci.yaml"

  push:
    branches:
      - dev
      - main
      - "feature/**"
    paths:
      - "k8s/apps/backend/**"
      - "deploy/argocd/**"
      - ".github/workflows/backend-kustomize-ci.yaml"

permissions:
  contents: read

jobs:
  kustomize-check:
    name: Render backend Kustomize overlays
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: |
          kubectl kustomize k8s/apps/backend/overlays/dev > /tmp/backend-dev.yaml
          grep "namespace: utterai-dev-api" /tmp/backend-dev.yaml
          grep "image:" /tmp/backend-dev.yaml

      - name: Render prod overlay
        run: |
          kubectl kustomize k8s/apps/backend/overlays/prod > /tmp/backend-prod.yaml
          grep "namespace: utterai-prod-api" /tmp/backend-prod.yaml
          grep "image:" /tmp/backend-prod.yaml
