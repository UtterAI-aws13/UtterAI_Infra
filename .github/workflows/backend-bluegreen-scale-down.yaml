name: Backend BlueGreen Scale Down

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "스케일 조정 대상 환경입니다. prod만 허용합니다."
        required: true
        type: choice
        options:
          - prod
      mode:
        description: "inactive color를 내릴지, 다시 살릴지 선택합니다."
        required: true
        type: choice
        options:
          - scale-down
          - restore
      target_color:
        description: "조정할 backend color입니다. active color는 scale-down할 수 없습니다."
        required: true
        type: choice
        options:
          - blue
          - green

permissions:
  contents: write
  pull-requests: write

jobs:
  scale:
    name: Scale backend color
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_env }}

    steps:
      - name: Prepare scale metadata
        id: meta
        env:
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGET_COLOR: ${{ inputs.target_color }}
        run: |
          TARGET_ENV="$INPUT_TARGET_ENV"
          MODE="$INPUT_MODE"
          TARGET_COLOR="$INPUT_TARGET_COLOR"
          TARGET_BRANCH="main"

          if [ "$TARGET_ENV" = "prod" ]; then
            OVERLAY_PATH="k8s/apps/backend/overlays/prod"
          else
            echo "target_env는 prod만 허용합니다."
            exit 1
          fi

          if [ "$MODE" != "scale-down" ] && [ "$MODE" != "restore" ]; then
            echo "mode는 scale-down 또는 restore만 허용합니다."
            exit 1
          fi

          if [ "$TARGET_COLOR" != "blue" ] && [ "$TARGET_COLOR" != "green" ]; then
            echo "target_color는 blue 또는 green만 허용합니다."
            exit 1
          fi

          {
            echo "target_env=$TARGET_ENV"
            echo "target_branch=$TARGET_BRANCH"
            echo "overlay_path=$OVERLAY_PATH"
            echo "mode=$MODE"
            echo "target_color=$TARGET_COLOR"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.UTTERAI_GITOPS_APP_ID }}
          private-key: ${{ secrets.UTTERAI_GITOPS_APP_PRIVATE_KEY }}
          owner: UtterAI-aws13
          repositories: UtterAI_Infra
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.target_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update backend color scale files
        id: update_scale
        env:
          OVERLAY_PATH: ${{ steps.meta.outputs.overlay_path }}
          MODE: ${{ steps.meta.outputs.mode }}
          TARGET_COLOR: ${{ steps.meta.outputs.target_color }}
        run: |
          ACTIVE_SERVICE_PATCH="$OVERLAY_PATH/patch-active-service.yaml"
          KUSTOMIZATION_FILE="$OVERLAY_PATH/kustomization.yaml"
          PATCH_DEPLOYMENT_FILE="$OVERLAY_PATH/patch-deployment.yaml"
          PATCH_HPA_FILE="$OVERLAY_PATH/patch-hpa.yaml"
          DEPLOYMENT_FILE="$OVERLAY_PATH/deployment-$TARGET_COLOR.yaml"
          HPA_FILE="hpa-$TARGET_COLOR.yaml"
          DEPLOYMENT_NAME="utterai-api-$TARGET_COLOR"
          HPA_NAME="utterai-api-$TARGET_COLOR-hpa"

          for file in "$ACTIVE_SERVICE_PATCH" "$KUSTOMIZATION_FILE" "$PATCH_DEPLOYMENT_FILE" "$PATCH_HPA_FILE" "$DEPLOYMENT_FILE"; do
            if [ ! -f "$file" ]; then
              echo "$file 파일을 찾을 수 없습니다."
              exit 1
            fi
          done

          ACTIVE_COLOR="$(ruby -ryaml -e '
            data = YAML.load_file(ARGV.fetch(0))
            puts data.fetch("spec").fetch("selector").fetch("color")
          ' "$ACTIVE_SERVICE_PATCH")"

          if [ "$ACTIVE_COLOR" != "blue" ] && [ "$ACTIVE_COLOR" != "green" ]; then
            echo "active color는 blue 또는 green만 허용합니다. 현재 값: $ACTIVE_COLOR"
            exit 1
          fi

          if [ "$MODE" = "scale-down" ] && [ "$TARGET_COLOR" = "$ACTIVE_COLOR" ]; then
            echo "현재 active color인 $TARGET_COLOR 는 scale-down할 수 없습니다."
            echo "먼저 promote workflow로 Service를 반대 color로 전환하고 검증한 뒤 실행하세요."
            exit 1
          fi

          export MODE TARGET_COLOR ACTIVE_COLOR KUSTOMIZATION_FILE PATCH_HPA_FILE
          export PATCH_DEPLOYMENT_FILE DEPLOYMENT_FILE DEPLOYMENT_NAME HPA_FILE HPA_NAME

          ruby -ryaml -e '
            mode = ENV.fetch("MODE")
            deployment_file = ENV.fetch("DEPLOYMENT_FILE")
            patch_deployment_file = ENV.fetch("PATCH_DEPLOYMENT_FILE")
            deployment_name = ENV.fetch("DEPLOYMENT_NAME")
            kustomization_file = ENV.fetch("KUSTOMIZATION_FILE")
            patch_hpa_file = ENV.fetch("PATCH_HPA_FILE")
            hpa_file = ENV.fetch("HPA_FILE")
            hpa_name = ENV.fetch("HPA_NAME")
            target_replicas = mode == "scale-down" ? 0 : 2

            deployment = YAML.load_file(deployment_file)
            deployment["spec"] ||= {}
            deployment["spec"]["replicas"] = mode == "scale-down" ? 0 : 1
            File.write(deployment_file, YAML.dump(deployment))

            patch_deployments = YAML.load_stream(File.read(patch_deployment_file)).compact
            patch_deployment = patch_deployments.find do |doc|
              doc.is_a?(Hash) &&
                doc["kind"] == "Deployment" &&
                doc.dig("metadata", "name") == deployment_name
            end

            unless patch_deployment
              warn "#{deployment_name} patch를 #{patch_deployment_file}에서 찾을 수 없습니다."
              exit 1
            end

            patch_deployment["spec"] ||= {}
            patch_deployment["spec"]["replicas"] = target_replicas

            File.open(patch_deployment_file, "w") do |file|
              patch_deployments.each do |doc|
                file.write(YAML.dump(doc))
              end
            end

            kustomization = YAML.load_file(kustomization_file)
            resources = kustomization.fetch("resources")

            if mode == "scale-down"
              resources.delete(hpa_file)
            else
              resources << hpa_file unless resources.include?(hpa_file)
            end

            kustomization["resources"] = resources
            File.write(kustomization_file, YAML.dump(kustomization))

            docs = YAML.load_stream(File.read(patch_hpa_file)).compact

            if mode == "scale-down"
              docs.reject! do |doc|
                doc.is_a?(Hash) &&
                  doc["kind"] == "HorizontalPodAutoscaler" &&
                  doc.dig("metadata", "name") == hpa_name
              end
            else
              exists = docs.any? do |doc|
                doc.is_a?(Hash) &&
                  doc["kind"] == "HorizontalPodAutoscaler" &&
                  doc.dig("metadata", "name") == hpa_name
              end

              unless exists
                docs << {
                  "apiVersion" => "autoscaling/v2",
                  "kind" => "HorizontalPodAutoscaler",
                  "metadata" => {
                    "name" => hpa_name,
                  },
                  "spec" => {
                    "minReplicas" => 2,
                    "maxReplicas" => 4,
                  },
                }
              end
            end

            File.open(patch_hpa_file, "w") do |file|
              docs.each do |doc|
                file.write(YAML.dump(doc))
              end
            end
          '

          {
            echo "active_color=$ACTIVE_COLOR"
          } >> "$GITHUB_OUTPUT"

          echo "Active color: $ACTIVE_COLOR"
          echo "Mode: $MODE"
          echo "Target color: $TARGET_COLOR"

      - name: Validate Kustomize render
        env:
          OVERLAY_PATH: ${{ steps.meta.outputs.overlay_path }}
          MODE: ${{ steps.meta.outputs.mode }}
          TARGET_COLOR: ${{ steps.meta.outputs.target_color }}
          ACTIVE_COLOR: ${{ steps.update_scale.outputs.active_color }}
        run: |
          kubectl kustomize "$OVERLAY_PATH" > /tmp/backend-scale-rendered.yaml

          ruby -ryaml -e '
            docs = YAML.load_stream(File.read("/tmp/backend-scale-rendered.yaml")).compact
            mode = ENV.fetch("MODE")
            target_color = ENV.fetch("TARGET_COLOR")
            active_color = ENV.fetch("ACTIVE_COLOR")

            service = docs.find do |doc|
              doc.is_a?(Hash) &&
                doc["kind"] == "Service" &&
                doc.dig("metadata", "name") == "utterai-api-service"
            end

            unless service
              warn "utterai-api-service 렌더링 결과를 찾을 수 없습니다."
              exit 1
            end

            service_color = service.dig("spec", "selector", "color")

            unless service_color == active_color
              warn "active Service selector가 예상과 다릅니다. expected=#{active_color}, actual=#{service_color}"
              exit 1
            end

            target_deployment_name = "utterai-api-#{target_color}"
            target_hpa_name = "utterai-api-#{target_color}-hpa"

            deployment = docs.find do |doc|
              doc.is_a?(Hash) &&
                doc["kind"] == "Deployment" &&
                doc.dig("metadata", "name") == target_deployment_name
            end

            unless deployment
              warn "#{target_deployment_name} 렌더링 결과를 찾을 수 없습니다."
              exit 1
            end

            replicas = deployment.dig("spec", "replicas")
            hpa = docs.find do |doc|
              doc.is_a?(Hash) &&
                doc["kind"] == "HorizontalPodAutoscaler" &&
                doc.dig("metadata", "name") == target_hpa_name
            end

            if mode == "scale-down"
              unless replicas == 0
                warn "#{target_deployment_name} replicas가 0이 아닙니다. actual=#{replicas.inspect}"
                exit 1
              end

              if hpa
                warn "#{target_hpa_name}가 아직 렌더링되고 있습니다. inactive color scale-down에서는 HPA를 제거해야 합니다."
                exit 1
              end
            else
              unless replicas == 2
                warn "#{target_deployment_name} replicas가 2가 아닙니다. actual=#{replicas.inspect}"
                exit 1
              end

              unless hpa
                warn "#{target_hpa_name} 렌더링 결과를 찾을 수 없습니다."
                exit 1
              end
            end

            puts "active Service color: #{service_color}"
            puts "#{target_deployment_name} replicas: #{replicas}"
            puts "#{target_hpa_name}: #{hpa ? "rendered" : "not rendered"}"
          '

      - name: Create scale pull request
        env:
          TARGET_ENV: ${{ steps.meta.outputs.target_env }}
          TARGET_BRANCH: ${{ steps.meta.outputs.target_branch }}
          MODE: ${{ steps.meta.outputs.mode }}
          TARGET_COLOR: ${{ steps.meta.outputs.target_color }}
          ACTIVE_COLOR: ${{ steps.update_scale.outputs.active_color }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          UPDATE_BRANCH="ci/backend-${TARGET_ENV}-${TARGET_COLOR}-${MODE}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "변경 사항이 없어 PR을 생성하지 않습니다."
            exit 0
          fi

          git checkout -b "$UPDATE_BRANCH"
          git add k8s/apps/backend/overlays/prod
          git commit -m "ci(backend): $MODE $TARGET_ENV $TARGET_COLOR color"
          git push origin "$UPDATE_BRANCH"

          PR_URL="$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$UPDATE_BRANCH" \
            --title "ci(backend): $MODE $TARGET_ENV $TARGET_COLOR color" \
            --body "Backend blue-green \`$TARGET_COLOR\` color의 scale 상태를 \`$MODE\`로 변경합니다.

          변경 대상:
          - 환경: \`$TARGET_ENV\`
          - 기준 브랜치: \`$TARGET_BRANCH\`
          - 현재 active color: \`$ACTIVE_COLOR\`
          - 조정 대상 color: \`$TARGET_COLOR\`
          - mode: \`$MODE\`

          \`scale-down\`은 active가 아닌 color의 Deployment replicas를 0으로 낮추고 HPA를 렌더링 대상에서 제거합니다.
          \`restore\`는 해당 color를 다음 promote 후보로 다시 검증할 수 있도록 Deployment replicas와 HPA를 복구합니다.

          prod 변경이므로 PR을 사람이 검토하고 merge한 뒤 Argo CD sync 상태를 확인해야 합니다.")"

          echo "Created PR: $PR_URL"
