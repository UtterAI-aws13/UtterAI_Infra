name: Terraform CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/terraform-ci.yml"

  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/terraform-ci.yml"

jobs:
  terraform-check:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    env:
      TF_WORKING_DIR: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        run: terraform -chdir="$TF_WORKING_DIR" fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir="$TF_WORKING_DIR" init -backend=false

      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIR" validate