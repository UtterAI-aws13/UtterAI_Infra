name: GitHub Actions Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"

  push:
    branches:
      - main
      - "feature/**"
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
