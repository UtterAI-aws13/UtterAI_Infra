name: AI Kustomize CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "k8s/apps/ai-worker/**"
      - "deploy/argocd/**"
      - ".github/workflows/ai-kustomize-ci.yaml"

  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "k8s/apps/ai-worker/**"
      - "deploy/argocd/**"
      - ".github/workflows/ai-kustomize-ci.yaml"

permissions:
  contents: read

jobs:
  kustomize-check:
    name: Render AI Kustomize overlays
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: |
          kubectl kustomize k8s/apps/ai-worker/overlays/dev > /tmp/ai-worker-dev.yaml
          grep "namespace: utterai-ai-cpu" /tmp/ai-worker-dev.yaml
          grep "namespace: utterai-ai-gpu" /tmp/ai-worker-dev.yaml
          grep "namespace: utterai-batch" /tmp/ai-worker-dev.yaml
          grep "image:" /tmp/ai-worker-dev.yaml

      - name: Render prod overlay
        run: |
          kubectl kustomize k8s/apps/ai-worker/overlays/prod > /tmp/ai-worker-prod.yaml
          grep "image:" /tmp/ai-worker-prod.yaml

      - name: Check unresolved placeholders
        run: |
          if grep -R -E "\\$\\{[A-Z0-9_]+\\}" k8s/apps/ai-worker /tmp/ai-worker-dev.yaml /tmp/ai-worker-prod.yaml; then
            echo "ai-worker manifest에 envsubst placeholder가 남아 있습니다."
            exit 1
          fi
