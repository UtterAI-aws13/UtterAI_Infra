name: AI Kustomize CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "k8s/apps/ai-worker/**"
      - "deploy/argocd/**"
      - ".github/workflows/ai-kustomize-ci.yaml"

  push:
    branches:
      - dev
      - main
      - "feature/**"
    paths:
      - "k8s/apps/ai-worker/**"
      - "deploy/argocd/**"
      - ".github/workflows/ai-kustomize-ci.yaml"

permissions:
  contents: read

jobs:
  kustomize-check:
    name: Render AI Kustomize overlays
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: |
          kubectl kustomize k8s/apps/ai-worker/overlays/dev > /tmp/ai-worker-dev.yaml
          grep "namespace: utterai-dev-ai-worker" /tmp/ai-worker-dev.yaml
          grep "image:" /tmp/ai-worker-dev.yaml

      - name: Render prod overlay
        run: |
          kubectl kustomize k8s/apps/ai-worker/overlays/prod > /tmp/ai-worker-prod.yaml
          grep "namespace: utterai-prod-ai-worker" /tmp/ai-worker-prod.yaml
          grep "image:" /tmp/ai-worker-prod.yaml
