apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Explicit membership: infra-lab and bootstrap resources are never discovered recursively.
resources:
  - platform-prod.yaml
  - backend-prod.yaml
  - ai-service-prod.yaml
  - ai-worker-prod.yaml
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
