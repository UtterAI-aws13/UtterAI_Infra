apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: utterai-ai-worker-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: utterai-ai-worker
    app.kubernetes.io/part-of: utterai
    utterai.io/environment: dev
  annotations:
    argocd.argoproj.io/manifest-generate-paths: ".;../../base"
spec:
  project: default
  source:
    repoURL: https://github.com/UtterAI-aws13/UtterAI_Infra
    targetRevision: main
    path: k8s/apps/ai-worker/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: utterai-ai-api
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: utterai-cpu-worker
      namespace: utterai-ai-cpu
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: utterai-ml-gpu-worker
      namespace: utterai-ai-gpu
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: utterai-batch-worker
      namespace: utterai-batch
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
