apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: utterai-bootstrap-prod
  namespace: argocd
spec:
  description: Administrator-owned prod Application bootstrap; not a tenant security
    boundary.
  sourceRepos:
  - https://github.com/UtterAI-aws13/UtterAI_Infra
  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd
  clusterResourceBlacklist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: Application
