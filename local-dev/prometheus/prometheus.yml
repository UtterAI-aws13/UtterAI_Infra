global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: postgres
    static_configs:
      - targets:
          - host.docker.internal:9187

  - job_name: cadvisor
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: nginx
    static_configs:
      - targets:
          - host.docker.internal:9113

  - job_name: otel-collector
    scrape_interval: 30s
    static_configs:
      - targets:
          - host.docker.internal:8889
