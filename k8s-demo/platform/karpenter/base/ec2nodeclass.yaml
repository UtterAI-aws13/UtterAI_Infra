apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "utterai-prod-eks-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "utterai-prod"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "utterai-prod"
  tags:
    karpenter.sh/discovery: "utterai-prod"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: AL2023
  role: "utterai-prod-eks-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "utterai-prod"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "utterai-prod"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    karpenter.sh/discovery: "utterai-prod"
