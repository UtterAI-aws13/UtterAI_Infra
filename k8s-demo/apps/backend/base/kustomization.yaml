apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# backend API 배포에 필요한 최소 Kubernetes 리소스입니다.
# 환경별 값은 overlays/dev, overlays/prod에서 patch로 분리합니다.
resources:
  - serviceaccount.yaml
  - rolebinding.yaml
  - configmap.yaml
  - external-secret.yaml
  - deployment-blue.yaml
  - deployment-green.yaml
  - service.yaml
  - hpa-blue.yaml
  - hpa-green.yaml
  - ingress.yaml
