apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: utterai-api-role
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: utterai-api-rolebinding
subjects:
  - kind: ServiceAccount
    name: utterai-api-sa
roleRef:
  kind: Role
  name: utterai-api-role
  apiGroup: rbac.authorization.k8s.io
