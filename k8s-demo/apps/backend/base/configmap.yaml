---
apiVersion: v1
kind: ConfigMap
metadata:
  name: utterai-api-config
data:
  APP_ENV: dev
  APP_NAME: utterai-backend
  API_PREFIX: "/api/v1"
  LOG_LEVEL: DEBUG
  FRONTEND_ORIGIN: https://d129p1nkqgquw3.cloudfront.net
  CORS_ALLOW_ORIGINS: https://d129p1nkqgquw3.cloudfront.net
  DB_USER: utterai_app
  DB_HOST: "${RDS_ENDPOINT}"
  DB_PORT: '5432'
  DB_NAME: utterai
  DB_POOL_SIZE: '5'
  DB_MAX_OVERFLOW: '10'
  REDIS_HOST: "${REDIS_ENDPOINT}"
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  REDIS_TLS_ENABLED: 'true'
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: '60'
  REFRESH_TOKEN_EXPIRE_DAYS: '14'
  AI_SERVICE_BASE_URL: http://utterai-ai-api-service.utterai-ai-api.svc.cluster.local:8080
  AI_SERVICE_ANALYSIS_PATH: "/internal/ai/analysis-jobs"
  AWS_REGION: ap-northeast-2
  RAW_AUDIO_BUCKET: utterai-dev-raw-audio
  TEMPLATE_BUCKET: utterai-dev-documents
  PRESIGNED_URL_EXPIRE_SECONDS: '900'
  SQS_AUDIO_PREPROCESS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-audio-preprocess-queue
  SQS_REPORT_ANALYSIS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-report-analysis-queue
  OTEL_SERVICE_NAME: backend
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.utterai-observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: otlp
  OTEL_TRACES_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,team=utterai
  CLOUDWATCH_LOG_GROUP: "/aws/eks/utterai-dev/backend"
  CORS_ORIGINS: '["https://d129p1nkqgquw3.cloudfront.net","http://localhost:5173"]'
