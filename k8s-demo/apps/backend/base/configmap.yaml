apiVersion: v1
kind: ConfigMap
metadata:
  name: utterai-api-config
data:
  APP_ENV: "dev"
  APP_NAME: "utterai-backend"
  API_BASE_PATH: "/api/v1"
  LOG_LEVEL: "DEBUG"
  FRONTEND_ORIGIN: "https://d4kxfdssuth29.cloudfront.net"
  CORS_ALLOW_ORIGINS: "https://d4kxfdssuth29.cloudfront.net"
  # TODO: k8s-deploy.sh에서는 Terraform output으로 치환하던 값입니다.
  # Kustomize 전환 후에는 dev/prod overlay 또는 ExternalSecret 기반으로 확정합니다.
  DB_HOST: "TODO_RDS_ENDPOINT"
  DB_PORT: "5432"
  DB_NAME: "utterai"
  DB_USER: "utterai_app"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  REDIS_HOST: "TODO_REDIS_ENDPOINT"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TLS_ENABLED: "true"
  RAW_AUDIO_BUCKET: "utterai-dev-raw-audio"
  SQS_AUDIO_PREPROCESS_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-audio-preprocess-queue"
  OTEL_SERVICE_NAME: "backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.utterai-observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,team=utterai"
  CLOUDWATCH_LOG_GROUP: "/aws/eks/utterai-dev/backend"
