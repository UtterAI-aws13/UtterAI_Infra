apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: utterai-ai-worker-config
  - path: patch-deployment.yaml
  - path: patch-serviceaccount.yaml
  - path: patch-scaledobject-cpu-worker.yaml
    target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: utterai-cpu-worker-scaledobject
    options:
      allowNameChange: false
  - path: patch-scaledobject-ml-gpu-worker.yaml
    target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: utterai-ml-gpu-worker-scaledobject
    options:
      allowNameChange: false
  - path: patch-scaledobject-batch-worker.yaml
    target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: utterai-batch-worker-scaledobject
    options:
      allowNameChange: false

# TODO: prod 배포 승인 이후 CD에서 prod-{short_sha} 또는 prod-v{semver}로 갱신합니다.
images:
  - name: utterai-ai-cpu
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu
    newTag: prod-placeholder
  - name: utterai-ai-gpu
    newName: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-gpu
    newTag: prod-placeholder
