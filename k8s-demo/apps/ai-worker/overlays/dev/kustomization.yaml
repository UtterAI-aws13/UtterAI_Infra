apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base

images:
  - name: utterai-ai-cpu
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu
    newTag: ${AI_CPU_TAG}
  - name: utterai-ai-gpu
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-gpu
    newTag: ${AI_GPU_TAG}
