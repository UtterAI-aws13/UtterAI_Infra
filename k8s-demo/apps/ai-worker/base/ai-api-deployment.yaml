---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-api
  namespace: utterai-ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-ai-api
  template:
    metadata:
      labels:
        app: utterai-ai-api
    spec:
      serviceAccountName: utterai-ai-api-sa
      terminationGracePeriodSeconds: 30
      containers:
      - name: ai-api
        image: utterai-ai-cpu:dev-placeholder
        command:
        - uvicorn
        - app.main:app
        - "--host"
        - 0.0.0.0
        - "--port"
        - '8080'
        ports:
        - containerPort: 8080
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: APP_ENV
          value: dev
        - name: SQS_AUDIO_PREPROCESS_QUEUE_URL
          value: https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-audio-preprocess-queue
        - name: SQS_RAG_INGEST_QUEUE_URL
          value: https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-rag-ingest-queue
        - name: LOG_LEVEL
          value: DEBUG
        - name: OTEL_SERVICE_NAME
          value: ai-api
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.utterai-observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=dev,team=utterai
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: "/health/live"
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/health/live"
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
---
---
apiVersion: v1
kind: Service
metadata:
  name: utterai-ai-api-service
  namespace: utterai-ai-api
spec:
  type: ClusterIP
  selector:
    app: utterai-ai-api
  ports:
  - port: 8080
    targetPort: 8080
