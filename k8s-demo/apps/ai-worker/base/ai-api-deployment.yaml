apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-api
  namespace: utterai-ai-api
  labels:
    app: utterai-ai-api
    app.kubernetes.io/name: utterai-ai-api
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-ai-api
  template:
    metadata:
      labels:
        app: utterai-ai-api
        app.kubernetes.io/name: utterai-ai-api
        app.kubernetes.io/part-of: utterai
    spec:
      serviceAccountName: utterai-ai-api-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-api
          image: utterai-ai-cpu:dev-placeholder
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: utterai-ai-worker-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "ai-api"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
