apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-batch-worker
  namespace: utterai-batch
  labels:
    app: utterai-batch-worker
    app.kubernetes.io/name: utterai-batch-worker
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-batch-worker
  template:
    metadata:
      labels:
        app: utterai-batch-worker
        app.kubernetes.io/name: utterai-batch-worker
        app.kubernetes.io/part-of: utterai
    spec:
      serviceAccountName: utterai-batch-worker-sa
      nodeSelector:
        workload: worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: utterai-ai-cpu:dev-placeholder
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.rag_ingest_worker"]
          envFrom:
            - configMapRef:
                name: utterai-ai-worker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_NAME
            - name: OTEL_SERVICE_NAME
              value: "batch-worker"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
