apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-cpu-worker
  namespace: utterai-ai-cpu
  labels:
    app: utterai-cpu-worker
    app.kubernetes.io/name: utterai-cpu-worker
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-cpu-worker
  template:
    metadata:
      labels:
        app: utterai-cpu-worker
        app.kubernetes.io/name: utterai-cpu-worker
        app.kubernetes.io/part-of: utterai
    spec:
      serviceAccountName: utterai-cpu-worker-sa
      nodeSelector:
        workload: worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: cpu-worker
          image: utterai-ai-cpu:dev-placeholder
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.cpu_worker"]
          envFrom:
            - configMapRef:
                name: utterai-ai-worker-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cpu-worker-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: "/tmp/huggingface"
            - name: OTEL_SERVICE_NAME
              value: "cpu-worker"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
