apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-cpu-worker
  labels:
    app.kubernetes.io/name: utterai-ai-cpu-worker
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: utterai-ai-cpu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: utterai-ai-cpu-worker
        app.kubernetes.io/part-of: utterai
    spec:
      serviceAccountName: utterai-ai-cpu-worker-sa
      nodeSelector:
        workload: worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: cpu-worker
          image: utterai-ai-cpu:dev-placeholder
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "from app.workers.cpu_worker import start_worker; start_worker()"]
          envFrom:
            - configMapRef:
                name: utterai-ai-worker-config
          env:
            - name: WORKER_TYPE
              value: "cpu"
            - name: MODEL_DEVICE
              value: "cpu"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
