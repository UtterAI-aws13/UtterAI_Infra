apiVersion: v1
kind: Namespace
metadata:
  name: ca-scale-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-scale-test-worker
  namespace: ca-scale-test
  labels:
    app: ca-scale-test-worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: ca-scale-test-worker
  template:
    metadata:
      labels:
        app: ca-scale-test-worker
    spec:
      nodeSelector:
        workload: worker
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "3500m"
              memory: "12Gi"
            limits:
              cpu: "3500m"
              memory: "12Gi"
