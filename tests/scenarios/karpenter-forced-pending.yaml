apiVersion: v1
kind: Namespace
metadata:
  name: autoscaling-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-scale-test
  namespace: autoscaling-test
  labels:
    app: karpenter-scale-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: karpenter-scale-test
  template:
    metadata:
      labels:
        app: karpenter-scale-test
    spec:
      nodeSelector:
        workload: cpu-worker
      tolerations:
        - key: dedicated
          operator: Equal
          value: worker
          effect: NoSchedule
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "3500m"
              memory: "12Gi"
            limits:
              cpu: "3500m"
              memory: "12Gi"
