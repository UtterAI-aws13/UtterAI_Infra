# 각 워크로드 SA에 필요한 최소 K8s 내부 권한 부여
# AWS 권한은 IRSA(serviceaccounts.yaml annotation)에서 처리
---
# utter-api: ConfigMap 읽기 (환경변수 주입용)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: utter-api-role
  namespace: utter-api
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: utter-api-rolebinding
  namespace: utter-api
subjects:
  - kind: ServiceAccount
    name: utter-api-sa
    namespace: utter-api
roleRef:
  kind: Role
  name: utter-api-role
  apiGroup: rbac.authorization.k8s.io
---
