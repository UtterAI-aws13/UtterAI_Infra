# ServiceAccount + IRSA(IAM Roles for Service Accounts) 연결 정의
#
# EKS Pod가 AWS 리소스(S3, SQS, Secrets Manager 등)에 접근할 때
# eks.amazonaws.com/role-arn 어노테이션으로 IAM Role을 위임받는다.
# 워크로드마다 별도 Role을 분리해 하나가 탈취되어도 피해 범위를 제한한다.
#
# ${AWS_ACCOUNT_ID}는 k8s-deploy.sh의 envsubst가 배포 시 실제 계정 ID로 치환한다.

---
# AI API — ECR pull, SQS(audio-preprocess) read/delete 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-ai-api-sa
  namespace: utterai-ai-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-ai-api-irsa-role
---
# 메인 백엔드 API — S3(raw-audio), SQS(audio-preprocess), Secrets Manager read 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-api-sa
  namespace: utterai-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-api-irsa-role
---
# CPU 워커 — S3(raw-audio) read/write, SQS(audio-preprocess consume, gpu-inference produce) 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-cpu-worker-sa
  namespace: utterai-ai-cpu
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-ai-cpu-irsa-role
---
# ML GPU 워커 — S3(raw-audio) read, SQS(gpu-inference consume, report-analysis produce) 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-ml-gpu-worker-sa
  namespace: utterai-ai-gpu
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-ai-ml-gpu-irsa-role
---
# 배치 워커 — S3(documents read/write), SQS(rag-ingest consume) 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-batch-worker-sa
  namespace: utterai-batch
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-batch-irsa-role
