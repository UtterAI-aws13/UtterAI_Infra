# ACCOUNT_ID, CLUSTER_NAME은 terraform output 또는 배포 스크립트에서 치환
# kubectl annotate serviceaccount 또는 envsubst로 주입
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utter-api-sa
  namespace: utter-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-api-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-cpu-worker-sa
  namespace: utter-ai-cpu
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-ai-cpu-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gpu-worker-sa
  namespace: utter-ai-gpu
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-ai-gpu-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-worker-sa
  namespace: utter-batch
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-batch-irsa-role
