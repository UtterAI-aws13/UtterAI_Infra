# ACCOUNT_ID, CLUSTER_NAME은 terraform output 또는 배포 스크립트에서 치환
# kubectl annotate serviceaccount 또는 envsubst로 주입
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-ai-api-sa
  namespace: utterai-ai-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-ai-api-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: utterai-api-sa
  namespace: utterai-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/utterai-dev-api-irsa-role
