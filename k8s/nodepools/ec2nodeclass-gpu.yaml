apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: AL2023
  role: utterai-dev-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: utterai-dev-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: utterai-dev-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  # GPU 노드 초기화 시 NVIDIA driver 설치
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="==BOUNDARY=="

    --==BOUNDARY==
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    # NVIDIA driver가 자동 설치되지 않을 경우 수동 설치
    # AL2023 + GPU instance는 일반적으로 드라이버 자동 로드
    --==BOUNDARY==--
  tags:
    Project: utterai
    Environment: dev
    Workload: ai-gpu
    ManagedBy: karpenter
