apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  # Terraform irsa 모듈이 생성한 karpenter node role
  role: utterai-dev-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: utterai-dev-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: utterai-dev-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    Project: utterai
    Environment: dev
    ManagedBy: karpenter
