apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ml-gpu-worker
  namespace: utterai-ai-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-ml-gpu-worker
  template:
    metadata:
      labels:
        app: utterai-ml-gpu-worker
        worker-type: ml-gpu
    spec:
      serviceAccountName: utterai-ml-gpu-worker-sa
      nodeSelector:
        workload: ai-gpu
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 300
      containers:
        - name: ml-gpu-worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-gpu:latest
          command: ["python", "-m", "app.workers.ml_gpu_worker"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-worker-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: "/tmp/huggingface"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_ML_GPU_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-audio-ml-queue"
            - name: SQS_LLM_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-llm-queue"
            - name: S3_RAW_AUDIO_BUCKET
              value: "utterai-dev-raw-audio"
            - name: S3_PROCESSED_AUDIO_BUCKET
              value: "utterai-dev-processed-audio"
            - name: S3_ARTIFACTS_BUCKET
              value: "utterai-dev-artifacts"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
