apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-api
  namespace: utterai-ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-ai-api
  template:
    metadata:
      labels:
        app: utterai-ai-api
    spec:
      serviceAccountName: utterai-ai-api-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-api
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_ANALYSIS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-analysis-queue"
            - name: LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: utterai-ai-api-service
  namespace: utterai-ai-api
spec:
  type: ClusterIP
  selector:
    app: utterai-ai-api
  ports:
    - port: 8080
      targetPort: 8080
