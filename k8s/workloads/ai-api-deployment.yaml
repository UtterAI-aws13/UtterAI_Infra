# AI API Deployment + Service
#
# 클러스터 내부에서 백엔드 API의 AI 처리 요청을 받는 내부 전용 서비스.
# utterai-ai-cpu 이미지를 사용하며 uvicorn으로 FastAPI 앱을 직접 실행한다.
# 외부 ALB Ingress가 없으므로 ClusterIP로만 노출된다.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-api
  namespace: utterai-ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-ai-api
  template:
    metadata:
      labels:
        app: utterai-ai-api
    spec:
      serviceAccountName: utterai-ai-api-sa
      # 진행 중인 AI 요청이 끊기지 않도록 30초 유예 후 종료
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-api
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu:${AI_CPU_TAG}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: APP_ENV
              value: "dev"
            - name: SQS_ANALYSIS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-audio-preprocess-queue"
            - name: SQS_RAG_INGEST_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-rag-ingest-queue"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: OTEL_SERVICE_NAME
              value: "ai-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.utterai-observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,team=utterai"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
# ClusterIP Service — 클러스터 내부 트래픽만 허용 (외부 노출 없음)
apiVersion: v1
kind: Service
metadata:
  name: utterai-ai-api-service
  namespace: utterai-ai-api
spec:
  type: ClusterIP
  selector:
    app: utterai-ai-api
  ports:
    - port: 8080
      targetPort: 8080
