apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-cpu-worker
  namespace: utterai-ai-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-cpu-worker
  template:
    metadata:
      labels:
        app: utterai-cpu-worker
    spec:
      serviceAccountName: utterai-cpu-worker-sa
      nodeSelector:
        workload: worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu:latest
          command: ["python", "-m", "app.workers.cpu_worker"]
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_CPU_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-audio-preprocess-queue"
            - name: SQS_ML_GPU_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-gpu-inference-queue"
            - name: S3_BUCKET_AUDIO
              value: "utterai-dev-raw-audio"
            - name: LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
