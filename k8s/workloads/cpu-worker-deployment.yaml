apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-cpu-worker
  namespace: utterai-ai-cpu
spec:
  # KEDA가 관리하므로 초기 replica=0
  replicas: 0
  selector:
    matchLabels:
      app: utterai-cpu-worker
  template:
    metadata:
      labels:
        app: utterai-cpu-worker
    spec:
      serviceAccountName: utterai-cpu-worker-sa
      nodeSelector:
        workload: ai-cpu
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai-cpu
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu:latest
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-analysis-queue"
            - name: S3_RAW_AUDIO_BUCKET
              value: "utterai-dev-raw-audio"
            - name: S3_PROCESSED_AUDIO_BUCKET
              value: "utterai-dev-processed-audio"
            - name: GPU_DIARIZATION_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-analysis-queue"
            - name: LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # Spot 중단 신호를 받으면 현재 메시지 처리 후 종료
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
