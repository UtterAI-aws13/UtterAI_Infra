apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-batch-worker
  namespace: utterai-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-batch-worker
  template:
    metadata:
      labels:
        app: utterai-batch-worker
    spec:
      serviceAccountName: utterai-batch-worker-sa
      nodeSelector:
        workload: worker
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu:${AI_CPU_TAG}
          command: ["python", "-m", "app.workers.rag_ingest_worker"]
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_RAG_INGEST_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-rag-ingest-queue"
            - name: S3_BUCKET_RAG
              value: "utterai-dev-documents"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_NAME
            - name: LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
