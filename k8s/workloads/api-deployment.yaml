# 메인 백엔드 API — Deployment + Service + HPA + ConfigMap
#
# 외부 사용자 요청을 처리하는 REST API 서버.
# ALB Ingress → utterai-api-service → 이 Deployment로 트래픽이 흐른다.
#
# 노드 배치 전략:
#   nodeSelector workload=api  — API 전용 노드풀(utterai-dev-api)에만 배치
#   toleration dedicated=api   — 해당 노드의 NoSchedule taint 허용
#   topologySpreadConstraints  — 가용 영역(AZ)별로 Pod를 고르게 분산해 AZ 장애 대응
#
# 환경변수 구조:
#   envFrom(ConfigMap)  — 비민감 앱 설정 (DB 호스트, Redis 호스트, 버킷명 등)
#   env(Secret)         — 민감 값 (DB 비밀번호, JWT 키 등) ExternalSecret이 동기화한 Secret 참조
#
# Health Probe:
#   readiness /health/ready — DB/Redis 연결 포함한 실제 서비스 가능 여부 확인
#   liveness  /health/live  — 프로세스 생존 여부만 확인 (DB 연결 불포함)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-api
  namespace: utterai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-api
  template:
    metadata:
      labels:
        app: utterai-api
    spec:
      serviceAccountName: utterai-api-sa
      nodeSelector:
        workload: api
      tolerations:
        - key: dedicated
          operator: Equal
          value: api
          effect: NoSchedule
      # AZ 간 최대 1개 차이로 Pod 분산 — 특정 AZ 장애 시 서비스 지속 가능
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: utterai-api
      initContainers:
        - name: db-migrate
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-backend:${BACKEND_TAG}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: utterai-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: DB_PASSWORD
      containers:
        - name: api
          # ${BACKEND_TAG}: k8s-deploy.sh에서 ECR 최신 이미지 태그로 envsubst 치환
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-backend:${BACKEND_TAG}
          ports:
            - containerPort: 8080
          # 비민감 설정 전체를 ConfigMap에서 일괄 로드
          envFrom:
            - configMapRef:
                name: utterai-api-config
          # 민감 값만 Secret에서 개별 주입 (envFrom으로 Secret 전체를 노출하지 않음)
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: JWT_SECRET_KEY
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: INTERNAL_CALLBACK_TOKEN
            - name: INTERNAL_CALLBACK_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: INTERNAL_CALLBACK_HMAC_SECRET
            - name: REDIS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-api-secret
                  key: REDIS_AUTH_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # ready: DB/Redis 연결 확인 포함 — 실패 시 트래픽 차단
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # live: 프로세스 응답 여부만 확인 — 실패 시 Pod 재시작
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
# ClusterIP Service — ALB Ingress의 백엔드 타겟
apiVersion: v1
kind: Service
metadata:
  name: utterai-api-service
  namespace: utterai-api
spec:
  type: ClusterIP
  selector:
    app: utterai-api
  ports:
    - port: 8080
      targetPort: 8080
---
# ConfigMap — 비민감 앱 설정
# ${RDS_ENDPOINT}, ${REDIS_ENDPOINT}, ${AWS_ACCOUNT_ID}는 k8s-deploy.sh envsubst가 치환
apiVersion: v1
kind: ConfigMap
metadata:
  name: utterai-api-config
  namespace: utterai-api
data:
  APP_ENV: "dev"
  APP_NAME: "utterai-backend"
  API_BASE_PATH: "/api/v1"
  LOG_LEVEL: "DEBUG"
  FRONTEND_ORIGIN: "https://d4kxfdssuth29.cloudfront.net"
  CORS_ALLOW_ORIGINS: "https://d4kxfdssuth29.cloudfront.net"
  DB_HOST: "${RDS_ENDPOINT}"
  DB_PORT: "5432"
  DB_NAME: "utterai"
  DB_USER: "utterai_app"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  REDIS_HOST: "${REDIS_ENDPOINT}"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # TLS 활성화: ElastiCache는 in-transit 암호화가 기본 활성화되어 있음
  REDIS_TLS_ENABLED: "true"
  RAW_AUDIO_BUCKET: "utterai-dev-raw-audio"
  SQS_AUDIO_PREPROCESS_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-audio-preprocess-queue"
  # OTEL Collector는 utterai-observability 네임스페이스에서 실행 중
  OTEL_SERVICE_NAME: "backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.utterai-observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,team=utterai"
  CLOUDWATCH_LOG_GROUP: "/aws/eks/utterai-dev/backend"
