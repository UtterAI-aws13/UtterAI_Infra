# LLM GPU Worker Deployment — 대화 분석 및 리포트 생성 파이프라인
#
# SQS report-analysis-queue에서 메시지를 소비해 LLM 추론으로 회의/상담 분석 리포트를 생성.
# HuggingFace 모델을 로드해 GPU에서 추론하며, 결과를 S3(reports)에 저장하고 DB에 기록한다.
#
# GPU 노드 배치 조건:
#   nodeSelector workload=ai-gpu  — GPU 전용 노드풀에만 스케줄링
#   toleration dedicated=ai-gpu   — 해당 노드의 NoSchedule taint 허용
#   toleration nvidia.com/gpu     — NVIDIA device plugin taint 허용

apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-llm-gpu-worker
  namespace: utterai-ai-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-llm-gpu-worker
  template:
    metadata:
      labels:
        app: utterai-llm-gpu-worker
        worker-type: llm-gpu
    spec:
      serviceAccountName: utterai-llm-gpu-worker-sa
      nodeSelector:
        workload: ai-gpu
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # LLM 추론은 오래 걸리므로 진행 중인 요청이 완료될 때까지 300초 유예
      terminationGracePeriodSeconds: 300
      containers:
        - name: llm-gpu-worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-gpu:${AI_GPU_TAG}
          command: ["python", "-m", "app.workers.llm_gpu_worker"]
          env:
            # HuggingFace Hub 인증 토큰 — ExternalSecret(gpu-worker-secret)에서 주입
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-worker-secret
                  key: HF_TOKEN
            # /tmp 사용: 컨테이너 루트 파일시스템 쓰기 권한 없이도 모델 캐시 저장 가능
            - name: HF_HOME
              value: "/tmp/huggingface"
            - name: AWS_REGION
              value: "ap-northeast-2"
            # 소비 큐: ML GPU 워커가 1차 추론 후 LLM 분석 요청을 enqueue
            - name: SQS_LLM_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-report-analysis-queue"
            - name: S3_BUCKET_AUDIO
              value: "utterai-dev-raw-audio"
            - name: S3_BUCKET_REPORT
              value: "utterai-dev-reports"
            # DB 접속 정보 — ExternalSecret(ai-worker-secret)에서 주입
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DB_NAME
            - name: LOG_LEVEL
              value: "DEBUG"
            # GPU 0번만 사용 — 멀티 GPU 노드에서 다른 워커와 GPU 충돌 방지
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          # nvidia.com/gpu: "1" 을 명시해야 NVIDIA device plugin이 GPU를 할당한다
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "14Gi"
              nvidia.com/gpu: "1"
          lifecycle:
            # preStop: LLM 추론 완료 후 결과 저장까지 10초 여유를 두고 SIGTERM 전달
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
