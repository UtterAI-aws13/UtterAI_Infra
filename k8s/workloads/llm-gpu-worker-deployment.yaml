apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-llm-gpu-worker
  namespace: utterai-ai-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-llm-gpu-worker
  template:
    metadata:
      labels:
        app: utterai-llm-gpu-worker
        worker-type: llm-gpu
    spec:
      serviceAccountName: utterai-llm-gpu-worker-sa
      nodeSelector:
        workload: ai-gpu
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 300
      containers:
        - name: llm-gpu-worker
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-gpu:latest
          command: ["python", "-m", "app.workers.llm_gpu_worker"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-worker-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: "/tmp/huggingface"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_LLM_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/${AWS_ACCOUNT_ID}/utterai-dev-report-analysis-queue"
            - name: S3_BUCKET_AUDIO
              value: "utterai-dev-raw-audio"
            - name: S3_BUCKET_REPORT
              value: "utterai-dev-reports"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-worker-secret
                  key: DATABASE_URL
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "14Gi"
              nvidia.com/gpu: "1"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
