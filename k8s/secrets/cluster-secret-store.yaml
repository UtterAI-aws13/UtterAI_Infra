# ClusterSecretStore — External Secrets Operator(ESO)와 AWS Secrets Manager 연결
#
# ClusterSecretStore는 클러스터 전체에서 공유되는 시크릿 저장소 참조다.
# 각 네임스페이스의 ExternalSecret이 이 스토어를 통해 AWS Secrets Manager에서 값을 가져온다.
# ESO Pod는 IRSA(eso-irsa-role)를 통해 Secrets Manager GetSecretValue 권한을 위임받는다.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
