# ExternalSecret — AI/배치 워커 DB 접속 정보
#
# AI API(utterai-ai-api), GPU 워커(utterai-ai-gpu), 배치 워커(utterai-batch)가
# PostgreSQL에 직접 접근할 때 사용.
# 백엔드 API와 별도 Secret을 사용해 워크로드별 접속 계정을 분리한다.
# 동일한 Secrets Manager 키(utterai-dev/ai-worker-secret)를 각 네임스페이스에 동기화한다.

# utterai-ai-api 네임스페이스 — AI API readiness/RAG DB 접근용
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-worker-external-secret
  namespace: utterai-ai-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-worker-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_PASSWORD
    - secretKey: DB_HOST
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_NAME
---
