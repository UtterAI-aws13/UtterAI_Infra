apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-worker-external-secret
  namespace: utterai-ai-gpu
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-worker-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_PASSWORD
    - secretKey: DB_HOST
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: utterai-dev/ai-worker-secret
        property: DB_NAME
