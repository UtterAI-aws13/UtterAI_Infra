# ExternalSecret — 메인 백엔드 API 시크릿
#
# AWS Secrets Manager의 utterai-dev/backend-api-secret에서 값을 가져와
# utterai-api 네임스페이스의 backend-api-secret k8s Secret으로 생성한다.
# refreshInterval: 1h — 운영 중 시크릿 로테이션 시 최대 1시간 내 자동 반영
#
# 포함 항목:
#   DB_PASSWORD             : PostgreSQL 접속 비밀번호
#   JWT_SECRET_KEY          : 사용자 인증 토큰 서명 키
#   INTERNAL_CALLBACK_TOKEN : 내부 서비스 간 콜백 인증 토큰
#   INTERNAL_CALLBACK_HMAC_SECRET : 콜백 페이로드 무결성 검증용 HMAC 키

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-api-external-secret
  namespace: utterai-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-api-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: utterai-dev/backend-api-secret
        property: DB_PASSWORD
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: utterai-dev/backend-api-secret
        property: JWT_SECRET_KEY
    - secretKey: INTERNAL_CALLBACK_TOKEN
      remoteRef:
        key: utterai-dev/backend-api-secret
        property: INTERNAL_CALLBACK_TOKEN
    - secretKey: INTERNAL_CALLBACK_HMAC_SECRET
      remoteRef:
        key: utterai-dev/backend-api-secret
        property: INTERNAL_CALLBACK_HMAC_SECRET
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: utterai-dev/redis-auth-token
        property: REDIS_AUTH_TOKEN
