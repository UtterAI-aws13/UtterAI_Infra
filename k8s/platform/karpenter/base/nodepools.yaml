apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: platform
spec:
  template:
    metadata:
      labels:
        role: platform
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3", "t3a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large"]
  limits:
    cpu: "16"
    memory: "32Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
spec:
  template:
    metadata:
      labels:
        role: system
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: CriticalAddonsOnly
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3", "t3a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large"]
  limits:
    cpu: "16"
    memory: "32Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: api
spec:
  template:
    metadata:
      labels:
        role: api
        workload: api
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: dedicated
          value: api
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium"]
  limits:
    cpu: "32"
    memory: "64Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
# cpu-worker: SQS 기반 작업 → Spot 중단 시 visibility timeout으로 자동 재처리
# 인스턴스 패밀리 4종으로 확장해 spot pool 확보
# 2xlarge: pod 1개(cpu.requests=2)가 xlarge(4vCPU)에서는 노드당 1개만 들어가
# maxReplicaCount(10)를 limits.cpu=32(=xlarge 8노드)로도 못 채우는 문제가 있었음.
# 2xlarge(8vCPU)로 올려 노드당 3pod가 들어가게 하고, limits도 4노드(2xlarge) 기준으로 맞춤
# → 32vCPU/8vCPU=4노드, 128Gi/32Gi=4노드 → 최대 12pod (maxReplicaCount=10 커버)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-worker
spec:
  template:
    metadata:
      labels:
        role: worker
        workload: cpu-worker
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: dedicated
          value: worker
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m5", "m5a", "m6i", "m6a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["2xlarge"]
  limits:
    cpu: "32"
    memory: "128Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
# batch-worker: RAG ingest는 중단 후 재시작 허용 가능한 작업 → Spot 우선
# 실제 요청(1CPU/2Gi)에 xlarge 과잉 → large 추가, c6a 추가로 spot pool 확장
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: batch-worker
spec:
  template:
    metadata:
      labels:
        role: worker
        workload: batch-worker
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
        - key: dedicated
          value: worker
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c5", "c6i", "c6a", "m5", "m6i"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
  limits:
    cpu: "32"
    memory: "64Gi"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
# gpu: SQS 기반 추론 작업 → Spot 중단 시 재처리 가능
# g4dn이 ap-northeast-2 spot 가용성 더 안정적, 2xlarge 추가로 pool 확보
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        role: gpu
        workload: ai-gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: dedicated
          value: ai-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g4dn", "g5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]
  limits:
    cpu: "32"
    memory: "128Gi"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
