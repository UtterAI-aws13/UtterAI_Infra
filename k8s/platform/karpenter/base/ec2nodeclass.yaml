apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "PLACEHOLDER"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "PLACEHOLDER"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "PLACEHOLDER"
  tags:
    karpenter.sh/discovery: "PLACEHOLDER"
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "PLACEHOLDER"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "PLACEHOLDER"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "PLACEHOLDER"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    karpenter.sh/discovery: "PLACEHOLDER"
