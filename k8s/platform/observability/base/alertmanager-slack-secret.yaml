# ExternalSecret은 monitoring 네임스페이스에 위치합니다.
# AlertmanagerConfig가 monitoring 네임스페이스에 있어야 Alertmanager가
# 네임스페이스 매처 제약 없이 team=utterai 라벨을 기준으로 라우팅할 수 있습니다.
#
# 사전 준비 (최초 1회):
#   aws secretsmanager create-secret \
#     --name "utterai-prod/alertmanager-slack" \
#     --secret-string '{"webhook_url":"https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"}' \
#     --region ap-northeast-2
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-secret
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: utterai-prod/alertmanager-slack
        property: webhook_url
