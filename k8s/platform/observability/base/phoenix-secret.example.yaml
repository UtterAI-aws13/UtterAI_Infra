apiVersion: v1
kind: Secret
metadata:
  name: phoenix-postgres-secret
  namespace: utterai-observability
type: Opaque
stringData:
  # Create a Phoenix-only database/user or schema on the existing PostgreSQL/RDS.
  # Do not commit real credentials.
  PHOENIX_SQL_DATABASE_URL: "postgresql://phoenix:REPLACE_ME@utterai-dev-rds.example.ap-northeast-2.rds.amazonaws.com:5432/phoenix"
