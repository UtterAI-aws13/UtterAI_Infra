# ExternalSecret은 monitoring 네임스페이스에 위치합니다.
# Discord webhook URL은 Git에 기록하지 않고 AWS Secrets Manager에만 저장합니다.
# 권장 Discord 채널: #monitoring-alerts
#
# 사전 준비 (최초 1회):
#   aws secretsmanager create-secret \
#     --name "utterai-prod/alertmanager-discord" \
#     --secret-string '{"webhook_url":"https://discord.com/api/webhooks/YOUR/DISCORD/WEBHOOK"}' \
#     --region ap-northeast-2
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord-secret
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: utterai-prod/alertmanager-discord
        property: webhook_url
