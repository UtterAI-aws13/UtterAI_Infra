# OpenTelemetry Collector - in-cluster OTLP endpoint for application telemetry.
#
# App pods send OTLP HTTP traffic to:
#   http://otel-collector.utterai-observability.svc.cluster.local:4318
#
# This collector accepts traces/metrics/logs, exports traces to Tempo, and
# exposes a Prometheus scrape endpoint for OTLP metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: utterai-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      attributes/redact:
        actions:
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
          - key: http.response.header.set_cookie
            action: delete
          - key: http.url
            action: delete
          - key: url.full
            action: delete
          - key: aws.s3.key
            action: delete
          - key: audio.object_key
            action: delete
          - key: audio.key
            action: delete
          - key: rag.key
            action: delete
          - key: queue.name
            action: delete
      resource/loki_labels:
        attributes:
          - action: insert
            key: service_name
            from_attribute: service.name
          - action: insert
            key: environment
            from_attribute: deployment.environment
          - action: insert
            key: namespace
            from_attribute: k8s.namespace.name
          - action: insert
            key: pod
            from_attribute: k8s.pod.name
          - action: insert
            key: loki.resource.labels
            value: "service_name,environment,namespace,pod"

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0]
        dimensions:
          - name: service.name
          - name: span.kind
          - name: http.status_code
        exemplars:
          enabled: true
        namespace: pipeline
      servicegraph:
        latency_histogram_buckets: [0.001, 0.002, 0.006, 0.01, 0.1, 0.25, 0.5, 1.0, 2.5]
        dimensions:
          - service.name
        store:
          ttl: 300s
          max_items: 1000

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      debug:
        verbosity: basic
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      loki:
        endpoint: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
        default_labels_enabled:
          exporter: false
          job: true

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlp/tempo, servicegraph, spanmetrics]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, debug]
        metrics/servicegraph:
          receivers: [servicegraph]
          processors: [batch]
          exporters: [prometheus]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, resource/loki_labels, batch]
          exporters: [loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: utterai-observability
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: utterai
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.103.1
          args:
            - "--config=/etc/otelcol-contrib/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prom-exporter
              containerPort: 8889
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: utterai-observability
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: utterai
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prom-exporter
      port: 8889
      targetPort: prom-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: utterai-observability
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: utterai
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: prom-exporter
      path: /metrics
      interval: 60s
