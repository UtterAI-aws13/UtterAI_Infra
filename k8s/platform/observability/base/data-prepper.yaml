apiVersion: v1
kind: ConfigMap
metadata:
  name: data-prepper-config
  namespace: utterai-observability
data:
  pipelines.yaml: |
    entry-pipeline:
      source:
        otel_trace_source:
          port: 21890
          ssl: false
      processor:
        - otel_traces_raw:
      sink:
        - pipeline:
            name: raw-trace-pipeline
        - pipeline:
            name: service-map-pipeline

    raw-trace-pipeline:
      source:
        pipeline:
          name: entry-pipeline
      sink:
        - opensearch:
            hosts: ["http://opensearch.utterai-observability.svc.cluster.local:9200"]
            insecure: true
            index_type: trace-analytics-raw

    service-map-pipeline:
      source:
        pipeline:
          name: entry-pipeline
      processor:
        - service_map_stateful:
            window_duration: 180
      sink:
        - opensearch:
            hosts: ["http://opensearch.utterai-observability.svc.cluster.local:9200"]
            insecure: true
            index_type: trace-analytics-service-map

  data-prepper-config.yaml: |
    ssl: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-prepper
  namespace: utterai-observability
  labels:
    app: data-prepper
    app.kubernetes.io/name: data-prepper
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-prepper
  template:
    metadata:
      labels:
        app: data-prepper
        app.kubernetes.io/name: data-prepper
        app.kubernetes.io/part-of: utterai
    spec:
      nodeSelector:
        karpenter.sh/nodepool: platform
      containers:
        - name: data-prepper
          image: opensearchproject/data-prepper:2.8.0
          ports:
            - name: otel-traces
              containerPort: 21890
            - name: health
              containerPort: 4900
          volumeMounts:
            - name: config
              mountPath: /usr/share/data-prepper/pipelines.yaml
              subPath: pipelines.yaml
              readOnly: true
            - name: config
              mountPath: /usr/share/data-prepper/config/data-prepper-config.yaml
              subPath: data-prepper-config.yaml
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /list
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /list
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: data-prepper-config
---
apiVersion: v1
kind: Service
metadata:
  name: data-prepper
  namespace: utterai-observability
  labels:
    app: data-prepper
    app.kubernetes.io/name: data-prepper
    app.kubernetes.io/part-of: utterai
spec:
  type: ClusterIP
  selector:
    app: data-prepper
  ports:
    - name: otel-traces
      port: 21890
      targetPort: otel-traces
