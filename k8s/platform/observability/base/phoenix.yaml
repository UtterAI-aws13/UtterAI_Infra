---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: utterai-observability
  labels:
    app: phoenix
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
        app.kubernetes.io/name: phoenix
        app.kubernetes.io/part-of: utterai
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          ports:
            - name: http
              containerPort: 6006
            - name: otlp-grpc
              containerPort: 4317
          env:
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            - name: PHOENIX_SQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phoenix-postgres-secret
                  key: PHOENIX_SQL_DATABASE_URL
            - name: PHOENIX_DEFAULT_RETENTION_POLICY_DAYS
              value: "7"
            - name: PHOENIX_TELEMETRY_ENABLED
              value: "false"
            - name: PHOENIX_ENABLE_PROMETHEUS
              value: "false"
            - name: PHOENIX_ALLOWED_PROVIDERS
              value: "NONE"
            - name: PHOENIX_ALLOWED_SANDBOX_PROVIDERS
              value: "NONE"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: utterai-observability
  labels:
    app: phoenix
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/part-of: utterai
spec:
  type: ClusterIP
  selector:
    app: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
