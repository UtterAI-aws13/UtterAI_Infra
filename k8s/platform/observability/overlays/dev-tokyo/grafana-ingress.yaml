apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-agent-lab-tokyo
  namespace: monitoring
  annotations:
    # DevOps Agent 연결용 Grafana는 public internet 노출보다 internal ALB를 우선합니다.
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/group.name: grafana-agent-lab-tokyo
    # Agent Lab 전용 Grafana HTTPS 인증서입니다.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:032886669461:certificate/34970981-b07f-4943-af72-c97fe3ed3e4f
spec:
  ingressClassName: alb
  rules:
    # TODO: Route 53 private hosted zone 또는 내부 DNS에 연결할 host로 교체합니다.
    - host: grafana-agent-lab-tokyo.internal.utterai.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # kube-prometheus-stack fullnameOverride가 utterai-monitoring이면 Grafana service는 보통 이 이름입니다.
                # 실제 이름은 kubectl get svc -n monitoring | grep -i grafana 로 확인합니다.
                name: utterai-monitoring-grafana
                port:
                  number: 80
