apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: "utterai-dev-tokyo-eks-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "utterai-dev-tokyo"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "utterai-dev-tokyo"
  tags:
    karpenter.sh/discovery: "utterai-dev-tokyo"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        deleteOnTermination: true
