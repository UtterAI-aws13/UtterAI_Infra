apiVersion: v1
kind: Namespace
metadata:
  name: capacity-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-policy
  namespace: capacity-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capacity-policy-read
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capacity-policy-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capacity-policy-read
subjects:
- kind: ServiceAccount
  name: capacity-policy
  namespace: capacity-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capacity-policy-write
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - patch
---
apiVersion: v1
kind: Service
metadata:
  name: capacity-policy
  namespace: capacity-system
  labels:
    app: capacity-policy
spec:
  selector:
    app: capacity-policy
  ports:
  - name: https
    port: 443
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-policy
  namespace: capacity-system
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: capacity-policy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: capacity-policy
      nodeSelector:
        role: system
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: *id001
            topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webhook
        image: utterai-capacity-policy:lab
        ports:
        - containerPort: 8443
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /readyz
            port: 8443
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: 8443
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: capacity-policy-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: capacity-policy
  namespace: capacity-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: capacity-policy
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: utterai-capacity-policy
webhooks:
- name: capacity.utterai.io
  admissionReviewVersions:
  - v1
  sideEffects: NoneOnDryRun
  failurePolicy: Ignore
  timeoutSeconds: 2
  reinvocationPolicy: Never
  namespaceSelector:
    matchLabels:
      capacity.utterai.io/enabled: 'true'
  objectSelector:
    matchLabels:
      capacity.utterai.io/enabled: 'true'
  rules:
  - operations:
    - CREATE
    apiGroups:
    - ''
    apiVersions:
    - v1
    resources:
    - pods
    scope: Namespaced
  clientConfig:
    service:
      namespace: capacity-system
      name: capacity-policy
      path: /mutate
      port: 443
    caBundle: ''
