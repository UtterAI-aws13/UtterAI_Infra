apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- certificates.yaml
patches:
- target:
    kind: MutatingWebhookConfiguration
    name: utterai-capacity-policy
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cert-manager.io/inject-ca-from: capacity-system/capacity-policy-serving
