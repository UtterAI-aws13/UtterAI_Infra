---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- "../../base"
- deployment.yaml
- hpa.yaml
- network-policy.yaml
- pdb.yaml
patches:
- path: patch-configmap.yaml
  target:
    kind: ConfigMap
    name: utterai-ai-service-config
- path: patch-serviceaccount.yaml
  target:
    kind: ServiceAccount
    name: utterai-ai-service-sa
- path: patch-external-secret.yaml
  target:
    kind: ExternalSecret
    name: ai-service-external-secret
images:
- name: utterai-ai-cpu
  newName: '032886669461.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-cpu'
  newTag: prod-d49952f
