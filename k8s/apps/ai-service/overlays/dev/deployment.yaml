---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-service
  namespace: utterai-ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-ai-service
  template:
    metadata:
      labels:
        app: utterai-ai-service
    spec:
      serviceAccountName: utterai-ai-service-sa
      nodeSelector:
        workload: cpu-worker
      tolerations:
      - key: dedicated
        operator: Equal
        value: worker
        effect: NoSchedule
      terminationGracePeriodSeconds: 90
      containers:
      - name: ai-service
        image: "utterai-ai-cpu:dev-placeholder"
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: utterai-ai-service-config
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-service-secret
              key: HF_TOKEN
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ai-service-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-service-secret
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ai-service-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ai-service-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: ai-service-secret
              key: DB_NAME
        - name: HF_HOME
          value: /tmp/huggingface
        lifecycle:
          preStop:
            exec:
              command:
              - "/bin/sh"
              - "-c"
              - sleep 5
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: "/health/ready"
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/health/live"
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3