# ExternalSecret — AI 서비스(HTTP)용 시크릿
#
# report-chat 에이전트가 retrieve_research_evidence 호출 시 KURE-v1 임베딩을
# 코드 최초 다운로드(HF_TOKEN)하고, pgvector RAG DB(DB_*)에 검색 쿼리를 던진다.
# DB 자격증명은 cpu-worker/batch-worker와 동일한 rag-ingest-secret을 재사용한다.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-service-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-service-secret
    creationPolicy: Owner
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: PLACEHOLDER/cpu-worker-secret
        property: HF_TOKEN
    - secretKey: DB_USER
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: PLACEHOLDER_RDS_SECRET_ARN
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_NAME