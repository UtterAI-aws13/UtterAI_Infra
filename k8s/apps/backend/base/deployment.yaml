apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-backend
  labels:
    app.kubernetes.io/name: utterai-backend
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: utterai-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: utterai-backend
        app.kubernetes.io/part-of: utterai
    spec:
      serviceAccountName: utterai-backend-sa
      # 기존 API nodepool 초안의 운영 의도를 반영합니다.
      # workload=api 라벨이 있는 노드에 backend API Pod를 배치합니다.
      nodeSelector:
        workload: api
      tolerations:
        - key: dedicated
          operator: Equal
          value: api
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: utterai-backend
      containers:
        - name: backend
          # 실제 ECR repository와 tag는 overlay의 images 설정 또는 CD workflow가 갱신합니다.
          image: utterai-backend:dev-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: utterai-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: utterai-backend-secret
                  key: DB_PASSWORD
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: utterai-backend-secret
                  key: INTERNAL_SERVICE_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
