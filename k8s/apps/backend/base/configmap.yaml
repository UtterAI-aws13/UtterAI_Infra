apiVersion: v1
kind: ConfigMap
metadata:
  name: utterai-backend-config
data:
  APP_NAME: "utterai-backend"
  API_BASE_PATH: "/api/v1"
  DB_PORT: "5432"
  DB_NAME: "utterai"
  DB_USER: "utterai_app"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TLS_ENABLED: "true"
