apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: utterai-backend-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # TODO: 실제 ACM 인증서 ARN은 환경별 overlay 또는 CD에서 주입합니다.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:000000000000:certificate/TODO
spec:
  ingressClassName: alb
  rules:
    - host: api.dev.utterai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: utterai-backend-service
                port:
                  name: http
