---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-api-external-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-api-secret
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: PLACEHOLDER_RDS_SECRET_ARN
      property: password
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: PLACEHOLDER/backend-api-secret
      property: JWT_SECRET_KEY
  - secretKey: INTERNAL_CALLBACK_TOKEN
    remoteRef:
      key: PLACEHOLDER/backend-api-secret
      property: INTERNAL_CALLBACK_TOKEN
  - secretKey: REDIS_AUTH_TOKEN
    remoteRef:
      key: PLACEHOLDER/redis-auth-token
      property: REDIS_AUTH_TOKEN
