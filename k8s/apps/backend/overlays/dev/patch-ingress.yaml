apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: utterai-backend-ingress
  annotations:
    alb.ingress.kubernetes.io/group.name: utterai-dev
    # TODO: dev ACM 인증서 ARN으로 교체합니다.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:000000000000:certificate/TODO_DEV
spec:
  rules:
    - host: api.dev.utterai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: utterai-backend-service
                port:
                  name: http
