apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-api-external-secret
spec:
  # RDS 마스터 유저 비밀번호가 7일마다 자동 로테이션되므로(rds! 관리형 시크릿),
  # base의 1h 대신 짧은 주기로 재정의해 로테이션 직후 stale password 창을 줄인다.
  refreshInterval: 5m
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "arn:aws:secretsmanager:ap-northeast-2:032886669461:secret:rds!db-33d36343-6a5a-4966-a055-0107fc502557-kAqi5e"
        property: password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: utterai-prod/backend-api-secret
        property: JWT_SECRET_KEY
    - secretKey: INTERNAL_CALLBACK_TOKEN
      remoteRef:
        key: utterai-prod/backend-api-secret
        property: INTERNAL_CALLBACK_TOKEN
    - secretKey: INTERNAL_CALLBACK_HMAC_SECRET
      remoteRef:
        key: utterai-prod/backend-api-secret
        property: INTERNAL_CALLBACK_HMAC_SECRET
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: utterai-prod/redis-auth-token
        property: REDIS_AUTH_TOKEN
