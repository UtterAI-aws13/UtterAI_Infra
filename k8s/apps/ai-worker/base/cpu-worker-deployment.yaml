---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-cpu-worker
  namespace: utterai-ai-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-cpu-worker
  template:
    metadata:
      labels:
        app: utterai-cpu-worker
    spec:
      serviceAccountName: utterai-cpu-worker-sa
      nodeSelector:
        workload: cpu-worker
      tolerations:
        - key: dedicated
          operator: Equal
          value: worker
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: utterai-ai-cpu:dev-placeholder
        command:
        - python
        - "-m"
        - app.workers.cpu_worker
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: HF_TOKEN
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: DB_NAME
        - name: BE_DB_USER
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: BE_DB_USER
        - name: BE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: BE_DB_PASSWORD
        - name: BE_DB_HOST
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: BE_DB_HOST
        - name: BE_DB_PORT
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: BE_DB_PORT
        - name: BE_DB_NAME
          valueFrom:
            secretKeyRef:
              name: cpu-worker-secret
              key: BE_DB_NAME
        - name: HF_HOME
          value: "/tmp/huggingface"
        - name: AWS_REGION
          value: ap-northeast-2
        - name: APP_ENV
          value: dev
        - name: SQS_AUDIO_PREPROCESS_QUEUE_URL
          value: https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-audio-preprocess-queue
        - name: SQS_GPU_INFERENCE_QUEUE_URL
          value: https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-gpu-inference-queue
        - name: SQS_REPORT_ANALYSIS_QUEUE_URL
          value: https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-report-analysis-queue
        - name: S3_BUCKET_REPORT
          value: utterai-dev-reports
        - name: BEDROCK_REGION
          value: ap-northeast-2
        - name: S3_BUCKET_AUDIO
          value: utterai-dev-raw-audio
        - name: LOG_LEVEL
          value: DEBUG
        - name: OTEL_SERVICE_NAME
          value: cpu-worker
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.utterai-observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=dev,team=utterai
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 20Gi
        lifecycle:
          preStop:
            exec:
              command:
              - "/bin/sh"
              - "-c"
              - sleep 5
