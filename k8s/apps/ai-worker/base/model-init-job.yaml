apiVersion: batch/v1
kind: Job
metadata:
  name: model-cache-init
  namespace: utterai-ai-gpu
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: utterai-ml-gpu-worker-sa
      nodeSelector:
        workload: ai-gpu
      tolerations:
      - key: dedicated
        operator: Equal
        value: ai-gpu
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc
      containers:
      - name: model-downloader
        image: 032886669461.dkr.ecr.ap-northeast-2.amazonaws.com/utterai-ai-gpu:dev-59855c3
        command:
        - python
        - -c
        - |
          import os
          print(f"HF_HOME: {os.environ.get('HF_HOME')}")
          from app.models.diarization_pyannote import PyannoteWrapper
          from app.models.asr_whisper import WhisperASRWrapper
          print("Downloading pyannote/speaker-diarization-3.1 ...")
          PyannoteWrapper(
              "pyannote/speaker-diarization-3.1",
              device="cuda",
              hf_token=os.environ.get("HF_TOKEN", ""),
          ).load()
          print("Downloading openai/whisper-large-v3-turbo ...")
          WhisperASRWrapper(
              "openai/whisper-large-v3-turbo",
              device="cuda",
          ).load()
          print("Model caching complete.")
        env:
        - name: HF_HOME
          value: /mnt/model-cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: gpu-worker-secret
              key: HF_TOKEN
        - name: AWS_REGION
          value: ap-northeast-2
        - name: APP_ENV
          value: dev
        volumeMounts:
        - name: model-cache
          mountPath: /mnt/model-cache
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '4'
            memory: 14Gi
            nvidia.com/gpu: '1'
      restartPolicy: Never
  backoffLimit: 1
