apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ai-llm-gpu-worker
  labels:
    app.kubernetes.io/name: utterai-ai-llm-gpu-worker
    app.kubernetes.io/part-of: utterai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: utterai-ai-llm-gpu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: utterai-ai-llm-gpu-worker
        app.kubernetes.io/part-of: utterai
        worker-type: llm-gpu
    spec:
      serviceAccountName: utterai-ai-llm-gpu-worker-sa
      nodeSelector:
        workload: ai-gpu
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 300
      containers:
        - name: llm-gpu-worker
          image: utterai-ai-gpu:dev-placeholder
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "from app.workers.llm_gpu_worker import start_worker; start_worker()"]
          envFrom:
            - configMapRef:
                name: utterai-ai-worker-config
          env:
            - name: WORKER_TYPE
              value: "llm-gpu"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: utterai-ai-gpu-secret
                  key: HF_TOKEN
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: utterai-ai-worker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: utterai-ai-worker-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: utterai-ai-worker-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: utterai-ai-worker-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: utterai-ai-worker-secret
                  key: DB_NAME
            - name: HF_HOME
              value: "/tmp/huggingface"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "14Gi"
              nvidia.com/gpu: "1"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
