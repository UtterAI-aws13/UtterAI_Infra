---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-ingest-external-secret
  namespace: utterai-batch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rag-ingest-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: PLACEHOLDER_RDS_SECRET_ARN
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_NAME