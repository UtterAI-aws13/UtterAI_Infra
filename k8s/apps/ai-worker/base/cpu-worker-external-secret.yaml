# ExternalSecret — CPU 워커 HuggingFace 토큰
#
# CPU 워커가 기동 시 Silero VAD(hf_hub_download)와 KURE-v1(SentenceTransformer)을
# HuggingFace Hub에서 다운로드할 때 필요한 인증 토큰.
# refreshInterval: 24h — 토큰은 자주 변경되지 않으므로 갱신 주기를 길게 설정

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cpu-worker-external-secret
  namespace: utterai-ai-cpu
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cpu-worker-secret
    creationPolicy: Owner
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: PLACEHOLDER/cpu-worker-secret
        property: HF_TOKEN
    - secretKey: DB_USER
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: PLACEHOLDER_RDS_SECRET_ARN
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: PLACEHOLDER/rag-ingest-secret
        property: DB_NAME
    - secretKey: BE_DB_USER
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_USER
    - secretKey: BE_DB_PASSWORD
      remoteRef:
        key: PLACEHOLDER_RDS_SECRET_ARN
        property: password
    - secretKey: BE_DB_HOST
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_HOST
    - secretKey: BE_DB_PORT
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_PORT
    - secretKey: BE_DB_NAME
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_NAME
