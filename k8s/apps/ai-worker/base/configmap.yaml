apiVersion: v1
kind: ConfigMap
metadata:
  name: utterai-ai-worker-config
  namespace: utterai-ai-api
data:
  APP_ENV: "dev"
  LOG_LEVEL: "DEBUG"
  AWS_REGION: "ap-northeast-2"
  BEDROCK_REGION: "ap-northeast-2"
  BEDROCK_REPORT_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
  S3_BUCKET_AUDIO: "utterai-dev-raw-audio"
  S3_BUCKET_REPORT: "utterai-dev-reports"
  S3_BUCKET_RAG: "utterai-dev-rag-ingest"
  S3_BUCKET_TEMPLATE: "utterai-dev-template"
  SQS_AUDIO_PREPROCESS_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-audio-preprocess-queue"
  SQS_GPU_INFERENCE_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-gpu-inference-queue"
  SQS_REPORT_ANALYSIS_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-report-analysis-queue"
  SQS_RAG_INGEST_QUEUE_URL: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-dev-rag-ingest-queue"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.utterai-observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,team=utterai"
---
