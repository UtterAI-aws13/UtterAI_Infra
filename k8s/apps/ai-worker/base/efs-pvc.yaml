apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-cache-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-00a39fe81d32c61d2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: utterai-ai-gpu
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: model-cache-pv
  resources:
    requests:
      storage: 20Gi
