# ExternalSecret — ML GPU 워커 BE DB 접속 정보 (utterai-ai-gpu 네임스페이스)
# RAG ingest 배치 워커는 rag-ingest-external-secret.yaml 참고

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-worker-external-secret
  namespace: utterai-ai-gpu
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-worker-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: PLACEHOLDER_RDS_SECRET_ARN
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: PLACEHOLDER/ai-worker-secret
        property: DB_NAME
