---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-batch-worker
  namespace: utterai-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: utterai-batch-worker
  template:
    metadata:
      labels:
        app: utterai-batch-worker
    spec:
      serviceAccountName: utterai-batch-worker-sa
      nodeSelector:
        workload: batch-worker
      tolerations:
        - key: dedicated
          operator: Equal
          value: worker
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
      - name: worker
        image: utterai-ai-cpu:dev-placeholder
        command:
        - python
        - "-m"
        - app.workers.rag_ingest_worker
        env:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: APP_ENV
          value: PLACEHOLDER
        - name: SQS_RAG_INGEST_QUEUE_URL
          value: PLACEHOLDER
        - name: S3_BUCKET_RAG
          value: PLACEHOLDER
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: rag-ingest-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rag-ingest-secret
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: rag-ingest-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: rag-ingest-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: rag-ingest-secret
              key: DB_NAME
        - name: LOG_LEVEL
          value: DEBUG
        - name: OTEL_SERVICE_NAME
          value: batch-worker
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.utterai-observability.svc.cluster.local:4318
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_METRICS_EXPORTER
          value: otlp
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: deployment.environment=dev,team=utterai
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 10Gi
        lifecycle:
          preStop:
            exec:
              command:
              - "/bin/sh"
              - "-c"
              - sleep 5
