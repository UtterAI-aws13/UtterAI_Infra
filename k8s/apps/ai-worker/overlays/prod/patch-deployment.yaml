apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-cpu-worker
  namespace: utterai-ai-cpu
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          env:
            - name: APP_ENV
              value: prod
            - name: SQS_AUDIO_PREPROCESS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-prod-audio-preprocess-queue"
            - name: SQS_GPU_INFERENCE_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-prod-gpu-inference-queue"
            - name: SQS_REPORT_ANALYSIS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-prod-report-analysis-queue"
            - name: S3_BUCKET_REPORT
              value: utterai-prod-reports
            - name: S3_BUCKET_AUDIO
              value: utterai-prod-raw-audio
            - name: LOG_LEVEL
              value: INFO
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=prod,team=utterai
            - name: HF_HOME
              value: /tmp/huggingface
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: utterai-ml-gpu-worker
  namespace: utterai-ai-gpu
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
      containers:
        - name: ml-gpu-worker
          env:
            - name: APP_ENV
              value: prod
            - name: SQS_GPU_INFERENCE_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-prod-gpu-inference-queue"
            - name: SQS_REPORT_ANALYSIS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-prod-report-analysis-queue"
            - name: S3_BUCKET_AUDIO
              value: utterai-prod-raw-audio
            - name: S3_BUCKET_REPORT
              value: utterai-prod-reports
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=prod,team=utterai
            - name: HF_HOME
              value: /tmp/huggingface
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hf-cache
              mountPath: /home/appuser/.cache
---
