apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: utterai-cpu-worker-scaledobject
  namespace: utterai-ai-cpu
spec:
  scaleTargetRef:
    name: utterai-cpu-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-pod-identity
        kind: ClusterTriggerAuthentication
      metadata:
        queueURL: "TODO_PROD_AUDIO_PREPROCESS_QUEUE_URL"
        queueLength: "5"
        awsRegion: ap-northeast-2
        identityOwner: operator
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-pod-identity
        kind: ClusterTriggerAuthentication
      metadata:
        queueURL: "TODO_PROD_REPORT_ANALYSIS_QUEUE_URL"
        queueLength: "5"
        awsRegion: ap-northeast-2
        identityOwner: operator
