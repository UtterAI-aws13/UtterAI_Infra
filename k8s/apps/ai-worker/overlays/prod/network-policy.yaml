---
# AI API namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-ai-api
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# CPU worker namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-ai-cpu
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# GPU worker namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-ai-gpu
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Batch worker namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-batch
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# backend -> ai-api Pod 8080 ingress 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-backend
  namespace: utterai-ai-api
spec:
  podSelector:
    matchLabels:
      app: utterai-ai-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - port: 8080
---
# Prometheus -> ai-api scrape 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-prometheus
  namespace: utterai-ai-api
spec:
  podSelector:
    matchLabels:
      app: utterai-ai-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
---
# AI API DNS egress 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: utterai-ai-api
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# CPU worker DNS egress 허용
apiVersion: networking.k8s.io/v1
