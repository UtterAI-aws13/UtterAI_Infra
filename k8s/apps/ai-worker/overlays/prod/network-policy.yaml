---
# CPU worker namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-ai-cpu
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# GPU worker namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-ai-gpu
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Batch worker namespace 기본 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: utterai-batch
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Prometheus scrape (monitoring → cpu-worker 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-prometheus
  namespace: utterai-ai-cpu
spec:
  podSelector:
    matchLabels:
      app: utterai-cpu-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
---
# Prometheus scrape (monitoring → gpu-worker)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-prometheus
  namespace: utterai-ai-gpu
spec:
  podSelector:
    matchLabels:
      app: utterai-ml-gpu-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
---
# CPU worker DNS egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: utterai-ai-cpu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# GPU worker DNS egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: utterai-ai-gpu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Batch worker DNS egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: utterai-batch
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# CPU worker AWS service (SQS, S3, Bedrock, Secrets Manager VPC Endpoint) + RDS + Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-aws
  namespace: utterai-ai-cpu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443   # SQS, S3, Bedrock, Secrets Manager (VPC Endpoint)
        - port: 5432  # RDS PostgreSQL
        - port: 6379  # ElastiCache Redis
---
# GPU worker AWS service + RDS + Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-aws
  namespace: utterai-ai-gpu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
        - port: 5432
        - port: 6379
---
# Batch worker AWS service (SQS, S3) + RDS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-aws
  namespace: utterai-batch
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
        - port: 5432  # RDS PostgreSQL
---
# CPU worker → OTEL collector (utterai-observability:4318)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel
  namespace: utterai-ai-cpu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utterai-observability
      ports:
        - port: 4318
          protocol: TCP
---
# GPU worker → OTEL collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel
  namespace: utterai-ai-gpu
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utterai-observability
      ports:
        - port: 4318
          protocol: TCP
---
# Batch worker → OTEL collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel
  namespace: utterai-batch
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utterai-observability
      ports:
        - port: 4318
          protocol: TCP
