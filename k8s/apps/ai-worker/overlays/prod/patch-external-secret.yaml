apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cpu-worker-external-secret
  namespace: utterai-ai-cpu
spec:
  # RDS 마스터 유저 비밀번호가 7일마다 자동 로테이션되므로(rds! 관리형 시크릿),
  # base의 24h(HF_TOKEN 기준) 대신 짧은 주기로 재정의해 로테이션 직후 stale password 창을 줄인다.
  refreshInterval: 5m
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: utterai-prod/cpu-worker-secret
        property: HF_TOKEN
    - secretKey: DB_USER
      remoteRef:
        key: utterai-prod/rag-ingest-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "arn:aws:secretsmanager:ap-northeast-2:032886669461:secret:rds!db-33d36343-6a5a-4966-a055-0107fc502557-kAqi5e"
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: utterai-prod/rag-ingest-secret
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: utterai-prod/rag-ingest-secret
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: utterai-prod/rag-ingest-secret
        property: DB_NAME
    - secretKey: BE_DB_USER
      remoteRef:
        key: utterai-prod/ai-worker-secret
        property: DB_USER
    - secretKey: BE_DB_PASSWORD
      remoteRef:
        key: "arn:aws:secretsmanager:ap-northeast-2:032886669461:secret:rds!db-33d36343-6a5a-4966-a055-0107fc502557-kAqi5e"
        property: password
    - secretKey: BE_DB_HOST
      remoteRef:
        key: utterai-prod/ai-worker-secret
        property: DB_HOST
    - secretKey: BE_DB_PORT
      remoteRef:
        key: utterai-prod/ai-worker-secret
        property: DB_PORT
    - secretKey: BE_DB_NAME
      remoteRef:
        key: utterai-prod/ai-worker-secret
        property: DB_NAME
---
