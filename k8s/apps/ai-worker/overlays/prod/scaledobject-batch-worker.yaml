apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: utterai-batch-worker-scaledobject
  namespace: utterai-batch
spec:
  scaleTargetRef:
    name: utterai-batch-worker
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-pod-identity
        kind: ClusterTriggerAuthentication
      metadata:
        queueURL: "https://sqs.ap-northeast-2.amazonaws.com/032886669461/utterai-prod-rag-ingest-queue"
        queueLength: "3"
        activationQueueLength: "0"
        awsRegion: ap-northeast-2
        identityOwner: operator
