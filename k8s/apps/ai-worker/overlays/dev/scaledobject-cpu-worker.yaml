apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: utterai-cpu-worker-scaledobject
  namespace: utterai-ai-cpu
spec:
  scaleTargetRef:
    name: utterai-cpu-worker
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 120
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-pod-identity
        kind: ClusterTriggerAuthentication
      metadata:
        queueURL: "https://sqs.ap-northeast-1.amazonaws.com/032886669461/utterai-dev-tokyo-audio-preprocess-queue"
        queueLength: "5"
        awsRegion: ap-northeast-1
        identityOwner: operator
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-pod-identity
        kind: ClusterTriggerAuthentication
      metadata:
        queueURL: "https://sqs.ap-northeast-1.amazonaws.com/032886669461/utterai-dev-tokyo-report-analysis-queue"
        queueLength: "5"
        awsRegion: ap-northeast-1
        identityOwner: operator
