# HPA — ML GPU 워커 자동 스케일링
#
# GPU 노드는 비용이 높으므로 maxReplicas를 2로 제한.
# GPU 워커는 CPU 기반 HPA보다 SQS 큐 깊이 기반 KEDA 스케일링이 더 효율적이나
# 현재는 CPU 메트릭으로 운영 중.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: utterai-ml-gpu-worker-hpa
  namespace: utterai-ai-gpu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: utterai-ml-gpu-worker
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
