# ExternalSecret — ML GPU 워커 HuggingFace 토큰
#
# ML GPU 워커(화자분리/STT)가 HuggingFace Hub에서 모델을 다운로드할 때 필요한 인증 토큰.
# LLM 추론은 Bedrock으로 전환되어 llm-gpu-worker는 제거됐다.
# refreshInterval: 24h — 토큰은 자주 변경되지 않으므로 갱신 주기를 길게 설정

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gpu-worker-external-secret
  namespace: utterai-ai-gpu
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gpu-worker-secret
    creationPolicy: Owner
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: utterai-dev/gpu-worker-secret
        property: HF_TOKEN
