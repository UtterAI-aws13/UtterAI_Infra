name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pytest -q --junitxml=evidence/tests-ci.xml
      - run: python -m slack_worker.demo --output evidence/http-burst-ci.json
      - run: python tools/package_lambda.py --output dist/lambda.zip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - run: |
          terraform fmt -check -recursive infra/terraform
          for env in local aws; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
        env:
          TF_IN_AUTOMATION: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence
          path: evidence/*-ci.*
