# Local model gateway: LiteLLM Proxy + PostgreSQL (keys, spend) + Redis (limits shared
# across proxy instances). Ollama runs on the host. Credentials are local test values.
#
#   docker compose -f gateway/compose.yaml up -d                     # one proxy on :4000
#   docker compose -f gateway/compose.yaml --profile scale up -d     # + second proxy on :4001

x-litellm: &litellm
  image: ghcr.io/berriai/litellm:v1.104.2
  command: ["--config", "/app/config.yaml", "--port", "4000"]
  volumes:
    - ./litellm.yaml:/app/config.yaml:ro
  environment:
    LITELLM_MASTER_KEY: sk-local-master-test-only
    DATABASE_URL: postgresql://litellm:litellm-local@postgres:5432/litellm
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    STORE_MODEL_IN_DB: "False"
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-local
      POSTGRES_DB: litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  litellm-a:
    <<: *litellm
    ports:
      - "127.0.0.1:4000:4000"

  litellm-b:
    <<: *litellm
    profiles: ["scale"]
    ports:
      - "127.0.0.1:4001:4000"

volumes:
  litellm-db:
