# Model gateway config. Applications call aliases (fast / quality / embed); which model sits
# behind an alias is decided here, not in application code.
#
# Prices below are TEST prices for exercising budget enforcement against free local models.
# They are not Bedrock prices and must not be read as cost estimates.

model_list:
  - model_name: fast
    litellm_params:
      model: ollama_chat/llama3.2:1b
      api_base: http://host.docker.internal:11434
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
  - model_name: quality
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
      input_cost_per_token: 0.0000001
    model_info:
      mode: embedding

litellm_settings:
  # The worker owns the attempt budget. Gateway retries or fallbacks would multiply model
  # calls (and cost) behind the worker's back, so both stay off.
  num_retries: 0
  request_timeout: 60
  drop_params: true

router_settings:
  num_retries: 0
  disable_cooldowns: true
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
