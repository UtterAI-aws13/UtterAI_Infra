display_information:
  name: Async LLM Sandbox
features:
  bot_user:
    display_name: Async LLM Sandbox
    always_online: false
  slash_commands:
    - command: /ask
      url: https://REPLACE_WITH_APPROVED_FUNCTION_URL/
      description: 비동기 질문
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
settings:
  event_subscriptions:
    request_url: https://REPLACE_WITH_APPROVED_FUNCTION_URL/
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
