events {}

http {
  upstream frontend_host {
    server host.docker.internal:5173;
  }

  upstream backend_host {
    server host.docker.internal:8000;
  }

  upstream ai_host {
    server host.docker.internal:8001;
  }

  upstream prometheus {
    server prometheus:9090;
  }

  upstream grafana {
    server grafana:3000;
  }

  server {
    listen 80;
    server_name localhost;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/ {
      proxy_pass http://backend_host;
    }

    location = /backend-health {
      proxy_pass http://backend_host/health;
    }

    location /ai/ {
      proxy_pass http://ai_host;
    }

    location /ai-health/ {
      rewrite ^/ai-health/(.*)$ /health/$1 break;
      proxy_pass http://ai_host;
    }

    location = /nginx_status {
      stub_status;
      access_log off;
    }

    location /prometheus/ {
      proxy_pass http://prometheus/;
    }

    location = /grafana {
      return 302 http://localhost:3000/;
    }

    location /grafana/ {
      return 302 http://localhost:3000/;
    }

    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://frontend_host;
    }
  }
}
